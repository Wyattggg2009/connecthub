<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ConnectHub · Admin</title><link rel="stylesheet" href="style.css?v=2"><style>body{background:#111424}.adminShell{max-width:1000px;margin:auto;padding:24px}.adminHeader{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}.adminHeader a{margin-left:auto}.adminGrid{display:grid;grid-template-columns:minmax(250px,340px) 1fr;gap:20px}.adminCard{background:#1a1e31;border:1px solid #30364d;border-radius:20px;padding:20px;min-width:0}.adminCard form{display:grid;gap:12px}.adminCard label{display:grid;gap:5px}.adminCard input{width:100%}.adminCard h2{margin-top:0}.userRow{padding:16px 0;border-bottom:1px solid #30364d}.userRow:last-child{border:0}.userRow h3{margin:0;overflow-wrap:anywhere}.userRow p{margin:5px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions button{font-size:13px}.adminLink,a{color:#b5abff;text-decoration:none}.adminLink:hover,a:hover{text-decoration:underline}#adminError{color:#ffb0b0;white-space:pre-wrap}#adminStatus{color:#b5e6ca}dialog{color:#e9edf9;background:#20263b;border:1px solid #30364d;border-radius:20px;width:min(400px,90vw);padding:24px}dialog::backdrop{background:#0009}@media(max-width:720px){.adminGrid{grid-template-columns:1fr}}</style><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script><script defer src="config.js"></script><script defer src="admin.js"></script></head><body><main class="adminShell"><header class="adminHeader"><div class="logo">✦</div><div><strong>ConnectHub</strong><small>ADMINISTRATION</small></div><a href="./">← Back to messaging</a></header><h1>Account management</h1><p id="adminStatus" role="status">Checking your administrator session…</p><p id="adminError" role="alert"></p><div id="adminContent" hidden><div class="adminGrid"><section class="adminCard"><h2>Create an account</h2><form id="createForm"><label>Username<input id="newUsername" required pattern="[A-Za-z0-9_]{3,24}" maxlength="24" autocomplete="off" autocapitalize="none"></label><label>Display name<input id="newName" required maxlength="40"></label><label>Initial password<input id="newPassword" required type="password" minlength="12" maxlength="72" autocomplete="new-password"></label><button class="primary">Create member</button><small>Share the password privately. The member can change it after signing in. No email address is needed.</small></form></section><section class="adminCard"><h2>Members and administrators</h2><button id="reload">Refresh list</button><div id="accountList"></div></section></div></div></main><dialog id="editDialog"><form id="editForm"><h2 id="editTitle">Edit member</h2><label id="editLabel">New value</label><input id="editValue" required><div class="actions"><button class="primary" type="submit">Save</button><button id="cancelEdit" type="button">Cancel</button></div></form></dialog></body></html>
