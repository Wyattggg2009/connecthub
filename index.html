<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111424"><title>ConnectHub</title><link rel="stylesheet" href="style.css"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script><script defer src="config.js"></script><script defer src="app.js"></script></head><body>
<div id="notice" role="status"></div>
<section id="auth" class="center"><form id="loginForm" class="panel"><div class="logo">✦</div><small>YOUR PRIVATE CONNECTION SPACE</small><h1>ConnectHub</h1><p>Stay close, wherever life takes you.</p><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="primary">Sign in →</button><p>Accounts are provided by your administrator.</p><p id="authError" role="alert"></p></form></section>
<section id="profileSetup" class="center" hidden><form id="profileForm" class="panel"><div class="logo">✦</div><h1>Make it yours</h1><label>Display name<input id="displayName" required maxlength="40"></label><button class="primary">Continue</button><button type="button" id="setupLogout">Sign out</button></form></section>
<div id="app" hidden><aside><div class="brand"><div class="logo">✦</div><div><strong>ConnectHub</strong><small>COMMUNICATION SPACE</small></div></div><div class="sectionTitle">DIRECT MESSAGES <button id="refresh" title="Refresh contacts">↻</button></div><input id="search" type="search" placeholder="Search contacts" aria-label="Search contacts"><div id="contacts"></div><footer><strong id="me"></strong><small id="status">Connecting…</small><button id="editName">Edit name</button><button id="logout">Sign out</button></footer></aside><main><section id="welcome"><div class="logo">✦</div><h1>Good to see you.</h1><p>Select a contact to start a conversation.</p></section><section id="chat" hidden><header><button id="back">←</button><div class="grow"><strong id="peerName"></strong><small>Private conversation</small></div><button id="voice">☎ Voice</button><button id="video">▣ Video</button></header><div id="messages" role="log" aria-live="polite"></div><form id="messageForm"><textarea id="message" placeholder="Write a message…" aria-label="Message" maxlength="4000" required rows="1"></textarea><button class="primary">Send ➤</button></form></section></main></div>
<div id="callPanel" class="overlay" hidden><section class="callWindow" role="dialog" aria-modal="true" aria-labelledby="callName"><small id="callType"></small><h2 id="callName"></h2><p id="callStatus"></p><div class="stage"><div id="callAvatar" class="logo">✦</div><video id="remoteVideo" autoplay playsinline hidden></video><video id="localVideo" autoplay muted playsinline hidden></video></div><div id="incomingControls" class="controls"><button id="accept" class="good">Accept</button><button id="decline" class="danger">Decline</button></div><div id="activeControls" class="controls" hidden><button id="mute">Mute mic</button><button id="camera">Camera off</button><button id="hangup" class="danger">End call</button></div></section></div></body></html>
